<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eine kleine Nachricht</title>
<style>
  body{
    font-family:system-ui,Arial,sans-serif;
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#111,#2b124c,#5b1b5f);
    color:white;
    padding:18px;
  }
  .card{
    width:100%;
    max-width:760px;
    background:rgba(255,255,255,.09);
    backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.22);
    border-radius:24px;
    padding:22px;
    box-shadow:0 20px 80px rgba(0,0,0,.35);
  }
  h1{font-size:1.55rem;margin:0 0 14px}
  #log{
    height:360px;
    overflow:auto;
    background:rgba(255,255,255,.08);
    border-radius:18px;
    padding:14px;
  }
  .m{margin:12px 0;line-height:1.45}
  .u{font-weight:700;color:#ffd6f5}
  .b{font-weight:700;color:#b8fff3}
  .row{display:flex;gap:10px;margin-top:14px}
  input{
    flex:1;
    padding:13px;
    border-radius:14px;
    border:0;
    outline:none;
    font-size:1rem;
  }
  button{
    padding:13px 18px;
    border-radius:14px;
    border:0;
    cursor:pointer;
    font-weight:700;
  }
  .hint{opacity:.75;font-size:.9rem;margin-top:10px}
  .heart{
    position:fixed;
    animation:float 2.8s linear forwards;
    pointer-events:none;
    font-size:24px;
  }
  @keyframes float{
    from{transform:translateY(0);opacity:1}
    to{transform:translateY(-160px);opacity:0}
  }
</style>
</head>
<body>
<div class="card">
  <h1>Ein kleines Experiment für dich ✨</h1>
  <div id="log"></div>

  <div class="row">
    <input id="msg" placeholder="Schreib etwas …" autocomplete="off" />
    <button id="send">Senden</button>
  </div>

  <div class="hint">Tipp: Schreib mal „Magnus“, „traurig“, „warum“ oder „Geheimnis“.</div>
</div>

<script>
const log = document.getElementById("log");
const msg = document.getElementById("msg");
let count = 0;

const normalReplies = [
  "Ich bin keine echte KI. Aber ich wurde mit echter Mühe gebaut.",
  "Manche Menschen sind nicht laut besonders. Sie sind einfach anders.",
  "Magnus wollte nichts Normales machen. Also hat er diese kleine Seite gebaut.",
  "Es gibt Dinge, die sagt man nicht perfekt. Aber man kann sie ehrlich sagen.",
  "Vielleicht ist das hier nur Code. Vielleicht aber auch ein kleiner Mutanfall.",
  "Du hast gerade mit einer Website geschrieben, die nur existiert, weil jemand an dich gedacht hat.",
  "Manchmal reicht ein kleiner Link, um zu sagen: Du bist nicht irgendein Mensch."
];

const special = [
  {
    trigger: "magnus",
    reply: "Magnus tut manchmal so, als wäre alles locker. Aber bei dir war ihm diese Seite wichtig."
  },
  {
    trigger: "traurig",
    reply: "Dann kurz Pause. Atmen. Du musst heute nicht alles alleine tragen."
  },
  {
    trigger: "warum",
    reply: "Weil manche Menschen eine schönere Antwort verdienen als nur eine normale Nachricht."
  },
  {
    trigger: "geheimnis",
    reply: "Geheimnis freigeschaltet: Magnus findet dich wirklich besonders. Nicht bisschen. Wirklich."
  },
  {
    trigger: "liebe",
    reply: "Gefährliches Wort. Aber schöne Dinge sind manchmal ein bisschen gefährlich."
  }
];

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function addLine(who,text){
  const div=document.createElement("div");
  div.className="m";
  div.innerHTML=`<span class="${who==="Du"?"u":"b"}">${who}:</span> ${escapeHtml(text)}`;
  log.appendChild(div);
  log.scrollTop=log.scrollHeight;
}

function addTypingLine(who,text){
  const div=document.createElement("div");
  div.className="m";
  div.innerHTML=`<span class="b">${who}:</span> <span></span>`;
  log.appendChild(div);
  const span=div.querySelector("span:last-child");
  let i=0;
  const timer=setInterval(()=>{
    span.textContent += text[i] || "";
    i++;
    log.scrollTop=log.scrollHeight;
    if(i>=text.length) clearInterval(timer);
  },24);
}

function hearts(){
  for(let i=0;i<12;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.textContent=["❤️","✨","💫","🌙"][Math.floor(Math.random()*4)];
    h.style.left=Math.random()*100+"vw";
    h.style.top=70+Math.random()*25+"vh";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),2800);
  }
}

function chooseReply(text){
  const lower=text.toLowerCase();
  const found=special.find(x=>lower.includes(x.trigger));
  if(found) return found.reply;

  if(count===5){
    hearts();
    return "Okay, jetzt kommt die ehrliche Nachricht: Diese Seite ist klein, aber der Gedanke dahinter nicht.";
  }

  return normalReplies[Math.floor(Math.random()*normalReplies.length)];
}

function send(){
  const t=msg.value.trim();
  if(!t) return;
  count++;
  msg.value="";
  addLine("Du",t);

  const reply=chooseReply(t);
  setTimeout(()=>addTypingLine("KI",reply),450+Math.random()*500);
}

document.getElementById("send").addEventListener("click",send);
msg.addEventListener("keydown",e=>{if(e.key==="Enter")send();});

addTypingLine("KI","Hey. Magnus hat mich schnell gebaut, aber nicht ohne Grund. Schreib mir irgendwas.");
</script>
</body>
</html>
